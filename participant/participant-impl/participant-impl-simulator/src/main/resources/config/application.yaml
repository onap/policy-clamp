spring:
  application:
    name: sim-ppnt
  security:
    user:
      name: ${HTTP_USER:participantUser}
      password: ${HTTP_PASSWORD:zb!XztG34}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.web.SpringDataWebAutoConfiguration

security:
  enable-csrf: false
participant:
  intermediaryParameters:
    topics:
      operationTopic: policy-acruntime-participant
      syncTopic: acm-ppnt-sync
    reportingTimeIntervalMs: 120000
    description: Participant Simulator
    participantId: ${participantId:101c62b3-8918-41b9-a747-d21eb79c6c90}
    threadPoolSize: 10
    kafka:
      bootstrapServers: ${KAFKA_SERVER:kafka:9092}
      authExceptionRetryInterval: 5s
      consumer:
        groupId: ${KAFKA_GROUP_ID:policy-clamp-ac-sim-ppnt}
      properties:
        security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
        sasl.mechanism: ${KAFKA_SASL_MECHANISM:GSSAPI}
        sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    participantSupportedElementTypes:
      -
        typeName: ${supportedElementTypeName:org.onap.policy.clamp.acm.SimAutomationCompositionElement}
        typeVersion: ${supportedElementTypeVersion:1.0.0}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      produce: ${TRACING_PROPAGATION_TYPE:W3C}
  opentelemetry:
    tracing:
      export:
        # Spring Boot 4: replaces management.tracing.enabled +
        # management.otlp.tracing.* from the Spring Boot 3 configuration
        enabled: ${ALLOW_TRACING:false}
        otlp:
          endpoint: ${TRACING_EXPORTER_ENDPOINT:}
          transport: ${TRACING_EXPORTER_PROTOCOL:http}
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      access: unrestricted
      show-details: always
      probes:
        enabled: true
      show-components: always

server:
  port: 6969
  ssl:
    enabled: false
  servlet:
    context-path: /onap/policy/simparticipant
