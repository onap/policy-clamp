spring:
  application:
    name: http-ppnt
  security:
    user:
      name: ${HTTP_USER:participantUser}
      password: ${HTTP_PASSWORD:zb!XztG34}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.web.SpringDataWebAutoConfiguration

security:
  enable-csrf: false
participant:
  intermediaryParameters:
    failUnsupportedOperation: false
    topics:
      operationTopic: policy-acruntime-participant
      syncTopic: acm-ppnt-sync
    threadPoolSize: 10
    topicValidation: ${TOPIC_VALIDATION:false}
    clampAdminTopics:
      servers:
        - ${kafkaServer:kafka:9092}
      topicCommInfrastructure: ${topicCommInfrastructure:NOOP}
      fetchTimeout: 15000
      useHttps: ${kafkaUseHttps:false}
      additionalProps:
        security.protocol: ${kafkaSecurityProtocol:PLAINTEXT}
        sasl.mechanism: ${kafkaSaslMechanism:GSSAPI}
        sasl.jaas.config: ${kafkaSaslJaasConfig:}
    reportingTimeIntervalMs: 120000
    description: Participant Http
    participantId: 101c62b3-8918-41b9-a747-d21eb79c6c01
    clampAutomationCompositionTopics:
      topicSources:
        - topic: ${participant.intermediaryParameters.topics.operationTopic}
          servers:
            - ${kafkaServer:kafka:9092}
          topicCommInfrastructure: ${topicCommInfrastructure:NOOP}
          fetchTimeout: 15000
          useHttps: ${kafkaUseHttps:false}
          allowTracing: ${ALLOW_TRACING:false}
          additionalProps:
            group.id: policy-clamp-ac-http-ppnt
            allow.auto.create.topics: ${allowAutoCreateTopics:true}
            security.protocol: ${kafkaSecurityProtocol:PLAINTEXT}
            sasl.mechanism: ${kafkaSaslMechanism:GSSAPI}
            sasl.jaas.config: ${kafkaSaslJaasConfig:}
        - topic: ${participant.intermediaryParameters.topics.syncTopic}
          servers:
            - ${kafkaServer:kafka:9092}
          topicCommInfrastructure: ${topicCommInfrastructure:NOOP}
          fetchTimeout: 15000
          useHttps: ${kafkaUseHttps:false}
          allowTracing: ${ALLOW_TRACING:false}
          additionalProps:
            allow.auto.create.topics: ${allowAutoCreateTopics:true}
            security.protocol: ${kafkaSecurityProtocol:PLAINTEXT}
            sasl.mechanism: ${kafkaSaslMechanism:GSSAPI}
            sasl.jaas.config: ${kafkaSaslJaasConfig:}
      topicSinks:
        - topic: ${participant.intermediaryParameters.topics.operationTopic}
          servers:
            - ${kafkaServer:kafka:9092}
          topicCommInfrastructure: ${topicCommInfrastructure:NOOP}
          useHttps: ${kafkaUseHttps:false}
          allowTracing: ${ALLOW_TRACING:false}
          additionalProps:
            allow.auto.create.topics: ${allowAutoCreateTopics:true}
            security.protocol: ${kafkaSecurityProtocol:PLAINTEXT}
            sasl.mechanism: ${kafkaSaslMechanism:GSSAPI}
            sasl.jaas.config: ${kafkaSaslJaasConfig:}
    participantSupportedElementTypes:
      -
        typeName: org.onap.policy.clamp.acm.HttpAutomationCompositionElement
        typeVersion: 1.0.0

management:
  tracing:
    export:
      enabled: ${ALLOW_TRACING:false}
    propagation:
      produce: ${TRACING_PROPAGATION_TYPE:W3C}
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_EXPORTER_ENDPOINT:}
          transport: ${TRACING_EXPORTER_PROTOCOL:http}
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      access: unrestricted
      show-details: always
      probes:
        enabled: true
      show-components: always

server:
  port: 6969
  ssl:
    enabled: false
  servlet:
    context-path: /onap/policy/clamp/acm/httpparticipant
